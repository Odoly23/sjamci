{% load static %}
{% block head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.0/MarkerCluster.Default.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/leaflet.markercluster.js"></script>
{% endblock head %}

<div id="map" style="width: 100%;height: 400px"></div>

<!-- maps script -->
<script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?key={{MAPBOX_TOKEN}}"></script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key={{google_key}}"></script>

<script>
var addressPoints1 = [
  {% for i in mapobjects %}
    {% if i.latitude and i.longitude %}  {# ← guard: skip jika koordinat kosong #}
    [
      {{i.latitude|safe}},
      {{i.longitude|safe}},
      "{% if i.benefisiariu.photo %}<img src='{{i.benefisiariu.photo.image.url}}' width='100%' height='100px'>{% endif %} <h4>{{i.benefisiariu.name|safe}}</h4><br/>Enderesu : {{i.village|safe}}, {{i.administrativepost.name|safe}}, {{i.municipality|safe}}"
    ],
    {% endif %}  {# ← tutup guard #}
  {% endfor %}
];

//maps layer
var googleMaps = L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {attribution: 'Google Maps',maxZoom: 20,subdomains:['mt0','mt1','mt2','mt3']});
var openStreetMaps = L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18,id: 'mapbox/streets-v11',tileSize: 512,zoomOffset: -1,accessToken: '{{MAPBOX_TOKENS}}'
});
//maps layer

var user_location = [-8.42565,125.32489084];
var map = L.map('map',{
    center: user_location,
    zoom: 8,
    layers: [googleMaps,openStreetMaps]
});
//icon///////////////////
var greenIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
var redIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
var yellowIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
var greyIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-grey.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
var orangeIcon = new L.Icon({
  iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});
var Icon2 = new L.icon({
    iconUrl: '{% static "main/mapa/icon-3.png" %}',
    iconSize:     [17, 17], // size of the icon
});
//icon///////////////////

var markers1 = L.markerClusterGroup();
for (var i = 0; i < addressPoints1.length; i++) {
  var a = addressPoints1[i];
  var title = a[2];
  var marker = L.marker(new L.LatLng(a[0], a[1]), {
    title: title,
    icon: Icon2
  });
  marker.bindPopup(title);
  markers1.addLayer(marker);
}
map.addLayer(markers1);

// var markers2 = L.markerClusterGroup();
// for (var i = 0; i < addressPoints2.length; i++) {
//   var a = addressPoints2[i];
//   var title = a[2];
//   var marker = L.marker(new L.LatLng(a[0], a[1]), {
//     title: title,
//     icon:yellowIcon
//   });
//   marker.bindPopup(title);
//   markers2.addLayer(marker);
// }
// map.addLayer(markers2);


var baseMaps = {
    "<span style='color: blue'>Street</span>": openStreetMaps,
    "<span style='color: green'>Google Maps</span>": googleMaps,
};

var overlayMaps = {
    // "<span style='color: grey'>Not Start</span>": markers1
    // "<span style='color: yellow'>On Going</span>": markers2
};

var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);
</script>
