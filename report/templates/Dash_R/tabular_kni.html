{% extends "main/layout.html" %}
{% load static %}

{% block content %}
<section class="content mb-4">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="card border-0 shadow-sm">
          
          <!-- Header -->
          <div class="card-header bg-transparent border-0 py-3">
            <h3 class="card-title mb-0">
              <i class="fa fa-table mr-2"></i>
              {{ legend|upper }}
            </h3>
          </div>

          <!-- Body -->
          <div class="card-body pt-2 pb-3">

            <!-- Row 1 -->
            <div class="row">

              <!-- Total Benefisiariu -->
              <div class="col-md-4 mb-3">
                <article class="text-center h-100">
                  <div class="mb-1">
                    <i class="fa fa-users fa-lg"></i>
                  </div>

                  <h6 class="mb-1 font-weight-bold">
                    TOTAL BENEFISIARIU
                  </h6>

                  <h3 class="mb-0">
                    <a href="" target="_blank" class="text-decoration-none" style="color: blue;">
                      1000
                    </a>
                  </h3>
                </article>
              </div>

              <!-- Total Mane -->
              <div class="col-md-4 mb-3">
                <article class="text-center h-100">
                  <div class="mb-1">
                    <i class="fa fa-male fa-lg"></i>
                  </div>

                  <h6 class="mb-1 font-weight-bold">
                    TOTAL MANE
                  </h6>

                  <h3 class="mb-0">
                    <a href="" target="_blank" class="text-decoration-none">
                      590
                    </a>
                  </h3>
                </article>
              </div>

              <!-- Total Feto -->
              <div class="col-md-4 mb-3">
                <article class="text-center h-100">
                  <div class="mb-1">
                    <i class="fa fa-female fa-lg"></i>
                  </div>

                  <h6 class="mb-1 font-weight-bold">
                    TOTAL FETO
                  </h6>

                  <h3 class="mb-0">
                    <a href="" target="_blank" class="text-decoration-none">
                      590
                    </a>
                  </h3>
                </article>
              </div>

            </div>

            <!-- Row 2 -->
            <div class="row">

              <!-- Total Ativu -->
              <div class="col-md-6 mb-2">
                <article class="text-center h-100">
                  <div class="mb-1">
                    <i class="fa fa-check-circle fa-lg"></i>
                  </div>

                  <h6 class="mb-1 font-weight-bold">
                    TOTAL ATIVU
                  </h6>

                  <h3 class="mb-0">
                    <a href="" target="_blank" class="text-decoration-none">
                      590
                    </a>
                  </h3>
                </article>
              </div>

              <!-- Total Parado -->
              <div class="col-md-6 mb-2">
                <article class="text-center h-100">
                  <div class="mb-1">
                    <i class="fa fa-times-circle fa-lg"></i>
                  </div>

                  <h6 class="mb-1 font-weight-bold">
                    TOTAL PARADO
                  </h6>

                  <h3 class="mb-0">
                    <a href="" target="_blank" class="text-decoration-none">
                      590
                    </a>
                  </h3>
                </article>
              </div>

            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock content %}
