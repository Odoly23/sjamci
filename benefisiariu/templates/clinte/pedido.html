{% extends "main/layout.html" %}
{% load static %}
{% block content %}
<section class="content mb-5">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 rounded-4 shadow-sm p-4">
          <h5 class="mb-1"><i class="fa fa-envelope"></i> {{ legend }}</h5>
          <p class="text-muted small mb-3">Haruka pedidu ka keluhan ba ekipa ita</p>

          <form method="POST">
            {% csrf_token %}

            <!-- Tipo -->
            <div class="mb-3">
              <label class="form-label fw-bold">Tipo Pedidu <span class="text-danger">*</span></label>
              <select name="tipo" class="form-select rounded-3" required>
                <option value="">— Hili tipo —</option>
                {% for val, label in tipo_choices %}
                  <option value="{{ val }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Assuntu -->
            <div class="mb-3">
              <label class="form-label fw-bold">Assuntu <span class="text-danger">*</span></label>
              <input type="text" name="assuntu" class="form-control rounded-3"
                     placeholder="Hakerek assuntu pedidu..." required maxlength="200">
            </div>

            <!-- Deskrisaun -->
            <div class="mb-3">
              <label class="form-label fw-bold">Deskrisaun / Razaun <span class="text-danger">*</span></label>
              <textarea name="deskrisaun" class="form-control rounded-3" rows="5"
                        placeholder="Esplika razaun pedidu ita nian..." required></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success btn-sm">
                <i class="fa fa-paper-plane"></i> Haruka
              </button>
              <a href="{% url 'cliente-dashboard' %}" class="btn btn-secondary btn-sm">
                <i class="fa fa-times"></i> Kansela
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
