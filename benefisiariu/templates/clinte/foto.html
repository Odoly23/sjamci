{% extends "main/layout.html" %}
{% load static %}
{% block content %}
<section class="content mb-5">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card border-0 rounded-4 shadow-sm p-4">
          <h5 class="mb-3"><i class="fa fa-camera"></i> Upload Foto Perfil</h5>

          <!-- Preview foto saat ini -->
          <div class="text-center mb-3">
            <img id="preview"
                 src="{% if photo and photo.image %}{{ photo.image.url }}{% else %}{% static 'img/default.png' %}{% endif %}"
                 class="rounded-circle object-fit-cover border border-2 border-primary"
                 style="width:120px;height:120px;">
          </div>

          <!-- Input file + crop area -->
          <div class="mb-3">
            <label class="form-label fw-bold">Hili Foto</label>
            <input type="file" id="imageInput" accept="image/*" class="form-control rounded-3">
          </div>

          <!-- Crop container -->
          <div id="cropContainer" class="mb-3" style="display:none;">
            <div style="max-height:300px;overflow:hidden;">
              <img id="cropImage" src="" style="max-width:100%;">
            </div>
            <div class="d-flex gap-2 mt-2 flex-wrap">
              <button type="button" id="btnCrop" class="btn btn-sm btn-primary">
                <i class="fa fa-crop"></i> Crop
              </button>
              <button type="button" id="btnCancel" class="btn btn-sm btn-secondary">
                <i class="fa fa-times"></i> Kansela
              </button>
            </div>
          </div>

          <!-- Form upload -->
          <form method="POST" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}
            <input type="hidden" name="cropped_image" id="croppedInput">
            <div id="cropResult" class="mb-3" style="display:none;">
              <p class="text-success"><i class="fa fa-check"></i> Foto pronto ba upload</p>
              <img id="croppedPreview" src="" class="rounded-circle"
                   style="width:80px;height:80px;object-fit:cover;">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success btn-sm" id="btnUpload" disabled>
                <i class="fa fa-save"></i> Rai Foto
              </button>
              <a href="{% url 'cliente-dashboard' %}" class="btn btn-secondary btn-sm">
                <i class="fa fa-times"></i> Fila
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}

{% block scripts %}
<!-- Cropper.js CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
  let cropper = null;

  document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(ev) {
      const cropImage = document.getElementById('cropImage');
      cropImage.src = ev.target.result;
      document.getElementById('cropContainer').style.display = 'block';
      document.getElementById('cropResult').style.display    = 'none';
      document.getElementById('btnUpload').disabled          = true;

      // Destroy cropper lama jika ada
      if (cropper) { cropper.destroy(); cropper = null; }

      cropper = new Cropper(cropImage, {
        aspectRatio: 1,       // square untuk foto profil
        viewMode:    2,
        movable:     true,
        zoomable:    true,
        scalable:    false,
      });
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('btnCrop').addEventListener('click', function() {
    if (!cropper) return;

    // Resize ke 300x300 px
    const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
    const dataURL = canvas.toDataURL('image/jpeg', 0.85);

    document.getElementById('croppedInput').value   = dataURL;
    document.getElementById('croppedPreview').src   = dataURL;
    document.getElementById('preview').src          = dataURL;
    document.getElementById('cropResult').style.display    = 'block';
    document.getElementById('cropContainer').style.display = 'none';
    document.getElementById('btnUpload').disabled          = false;

    cropper.destroy();
    cropper = null;
  });

  document.getElementById('btnCancel').addEventListener('click', function() {
    document.getElementById('cropContainer').style.display = 'none';
    document.getElementById('imageInput').value = '';
    if (cropper) { cropper.destroy(); cropper = null; }
  });
</script>
{% endblock scripts %}
