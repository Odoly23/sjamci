{% extends "main/layout.html" %}
{% load static %}

{% block content %}
<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-sm-12">
      <div class="card shadow-lg rounded">
        <div class="card-header">
          {{legend|upper}}
        </div>
        <div class="card-body">
            <form method="POST">
            {% csrf_token %}
            <div class="form-group">
              <label>Status</label>
              <select name="status" class="form-control">
                <option value="pending">Pending</option>
                <option value="prosesu">Prosesu</option>
                <option value="resolvidu">Resolvidu</option>
                <option value="rejeita">Rejeita</option>
              </select>
            </div>
            <div class="form-group">
              <label>Resposta</label>
              <textarea name="resposta" class="form-control"></textarea>
            </div>
            <button class="btn btn-success btn-sm"><i class="fa fa-save"></i> Save</button>
            <a href="#" class="btn btn-secondary btn-sm" onclick="self.history.back()"><i class="fa fa-times"></i> Kansela</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
