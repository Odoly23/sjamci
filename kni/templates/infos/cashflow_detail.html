{% extends "main/layout.html" %}
{% load static %}

{% block content %}

<div class="container-fluid mt-3">
  <div class="row">
      <div class="col-sm-12">
    <div class="card shadow-lg pt-1 border-primary rounded">
        <!-- HEADER -->
        <div class="card-header bg-steel d-flex justify-content-between align-items-center">
          <span>{{ legend}}</span>
        </div>
    <div class="card-body">

      <p><b>Business:</b> {{ cashflow.monitoring.business }}</p>
      <p><b>Type:</b> {{ cashflow.transaction_type }}</p>
      <p><b>Description:</b> {{ cashflow.description }}</p>
      <p><b>Amount:</b> ${{ cashflow.amount }}</p>
      <p><b>Date:</b> {{ cashflow.transaction_date }}</p>


    </div>
</div>
    </div>
  </div>

</div>


{% endblock %}
